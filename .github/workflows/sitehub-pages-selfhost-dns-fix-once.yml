name: SiteHub Pages selfhost DNS fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-pages-selfhost-dns-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dig-only lookups with Node DNS resolver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/sitehub-pages-full-reset-cutover-once.yml')
          s=p.read_text()
          reps={
            '''current=$(dig +short A "$HOST" | paste -sd, -)''': '''current=$(node -e 'const d=require("dns");d.resolve4(process.argv[1],(e,a)=>{if(e){console.error(e.code);process.exit(2)};process.stdout.write([...new Set(a)].join(","))})' "$HOST")''',
            '''one=$(dig @1.1.1.1 +short CNAME "$HOST" | sed 's/\\.$//' | head -n1)''': '''one=$(node -e 'const d=require("dns");const r=new d.Resolver();r.setServers(["1.1.1.1"]);r.resolveCname(process.argv[1],(e,a)=>{if(e&&e.code!=="ENODATA"&&e.code!=="ENOTFOUND"){console.error(e.code);process.exit(2)};process.stdout.write((a&&a[0]||"").replace(/\\.$/,""))})' "$HOST")''',
            '''eight=$(dig @8.8.8.8 +short CNAME "$HOST" | sed 's/\\.$//' | head -n1)''': '''eight=$(node -e 'const d=require("dns");const r=new d.Resolver();r.setServers(["8.8.8.8"]);r.resolveCname(process.argv[1],(e,a)=>{if(e&&e.code!=="ENODATA"&&e.code!=="ENOTFOUND"){console.error(e.code);process.exit(2)};process.stdout.write((a&&a[0]||"").replace(/\\.$/,""))})' "$HOST")'''
          }
          for old,new in reps.items():
              n=s.count(old); assert n==1,(old,n); s=s.replace(old,new)
          p.write_text(s)
          print('P09_DNS_FIX=PASS')
          PY
          git config user.name sitehub-bot
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add .github/workflows/sitehub-pages-full-reset-cutover-once.yml
          git commit -m 'Fix p09 self-hosted DNS lookups without dig'
          git push origin HEAD:main
