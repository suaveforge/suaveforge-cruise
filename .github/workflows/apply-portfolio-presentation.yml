name: Apply portfolio presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-portfolio-presentation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader into public pages
        shell: python
        run: |
          from pathlib import Path
          tag='<script src="./portfolio-presentation.js"></script>'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if tag not in s and '</head>' in s:
                  p.write_text(s.replace('</head>',tag+'\n</head>',1),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          git diff --cached --quiet || git commit -m "Apply portfolio presentation mode"
          git push
