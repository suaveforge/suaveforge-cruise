name: SiteHub SearchOps complete p09 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sitehub-searchops-complete-once.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete SiteHub contract
        env:
          PROJECT_ID: p09
          PUBLIC_URL: https://cruise.suaveforge.com/
          PROJECT_NAME: CruisePickers
          DESCRIPTION: CruisePickers는 한국어로 글로벌 크루즈사의 노선·지역·특가를 비교하고 예약 정보를 확인하는 크루즈 비교 서비스입니다.
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/suaveforge/sitehub-deploy/8289fa3e45143954bda73514ad6fd3667d90891d/searchops/static-complete-adapter.py -o /tmp/sitehub.py
          python /tmp/sitehub.py
          git config user.name 'SuaveForge SiteHub'; git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then git commit -m 'Apply SiteHub SearchOps p09'; git push; fi
