name: SiteHub origin secret probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-origin-secret-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check known SSH secret names without revealing values
        env:
          SSH_HOST_VALUE: ${{ secrets.SSH_HOST }}
          SSH_PORT_VALUE: ${{ secrets.SSH_PORT }}
          SSH_USER_VALUE: ${{ secrets.SSH_USER }}
          SSH_PASS_VALUE: ${{ secrets.SSH_PASS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${SSH_HOST_VALUE:-}" ] && h=yes || h=no
          [ -n "${SSH_PORT_VALUE:-}" ] && p=yes || p=no
          [ -n "${SSH_USER_VALUE:-}" ] && u=yes || u=no
          [ -n "${SSH_PASS_VALUE:-}" ] && w=yes || w=no
          m=no; [ "${SSH_HOST_VALUE:-}" = '203.229.213.74' ] && m=yes || true
          echo "SSH_SECRET_PRESENCE host=$h port=$p user=$u pass=$w"
          echo "SSH_HOST_MATCH_203=$m"
