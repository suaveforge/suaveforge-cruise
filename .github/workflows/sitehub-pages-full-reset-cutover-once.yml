name: SiteHub Pages full reset cutover once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitehub-pages-full-reset-cutover-once.yml'

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  reset-cutover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    env:
      HOST: cruise.suaveforge.com
      DNS_NAME: cruise
      ZONE: suaveforge.com
      OLD_IP: 203.229.213.74
      PAGES_TARGET: suaveforge.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load protected credentials and preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          CREDS=''
          for f in /home/idhair/secrets/spaceship.env /home/localizehub/secrets/spaceship.env; do [ -s "$f" ] && { CREDS="$f"; break; }; done
          [ -n "$CREDS" ]; set -a; . "$CREDS"; set +a
          TOKEN_FILE=/home/actions-runners/suaveforge-org/secrets/deploy-token
          [ -s "$TOKEN_FILE" ]; GH_DEPLOY_TOKEN=$(tr -d '\r\n' < "$TOKEN_FILE")
          echo "::add-mask::$SPACESHIP_API_KEY"; echo "::add-mask::$SPACESHIP_API_SECRET"; echo "::add-mask::$GH_DEPLOY_TOKEN"
          { echo "SPACESHIP_API_KEY=$SPACESHIP_API_KEY"; echo "SPACESHIP_API_SECRET=$SPACESHIP_API_SECRET"; echo "GH_DEPLOY_TOKEN=$GH_DEPLOY_TOKEN"; } >> "$GITHUB_ENV"
          [ -f CNAME ]; grep -Fxq "$HOST" CNAME
          current=$(dig +short A "$HOST" | paste -sd, -); echo "P09_RESET_PREFLIGHT_A=$current"
          echo "$current" | tr ',' '\n' | grep -Fxq "$OLD_IP"
          curl -fsSIL --connect-timeout 8 --max-time 20 "https://$HOST/" | sed -n '1,5p'
          echo 'P09_RESET_PREFLIGHT=PASS'

      - name: Install rollback helper
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p09-dns.mjs <<'NODE'
          const mode=process.argv[2], zone=process.env.ZONE, name=process.env.DNS_NAME, oldIp=process.env.OLD_IP, target=process.env.PAGES_TARGET;
          const base=`https://spaceship.dev/api/v1/dns/records/${zone}`;
          const headers={'X-API-Key':process.env.SPACESHIP_API_KEY,'X-API-Secret':process.env.SPACESHIP_API_SECRET,'Content-Type':'application/json','User-Agent':'SITEHUB-P09-RESET-2026.09.09'};
          const norm=v=>String(v||'').trim().replace(/\.+$/,'').toLowerCase();
          async function call(method,payload,suffix=''){const r=await fetch(base+suffix,{method,headers,body:payload==null?undefined:JSON.stringify(payload)});const t=await r.text();if(!r.ok)throw new Error(`spaceship_${method}_${r.status}_${t.slice(0,120)}`);return t?JSON.parse(t):{}}
          async function rows(){const j=await call('GET',null,'?take=500&skip=0&orderBy=name');return Array.isArray(j.items)?j.items:[]}
          async function del(items){if(items.length)await call('DELETE',items)}
          async function put(item){await call('PUT',{force:true,items:[item]})}
          let all=await rows(); const same=all.filter(r=>norm(r.name)===norm(name)&&['A','CNAME'].includes(String(r.type||'').toUpperCase()));
          const remove=same.map(r=>String(r.type).toUpperCase()==='A'?{type:'A',name:r.name,address:r.address}:{type:'CNAME',name:r.name,cname:r.cname}).filter(x=>x.address||x.cname);
          await del(remove);
          if(mode==='cutover') await put({type:'CNAME',name,cname:target,ttl:60});
          else if(mode==='rollback') await put({type:'A',name,address:oldIp,ttl:300});
          else throw new Error('bad_mode');
          all=await rows(); const ok=mode==='cutover'?all.some(r=>norm(r.name)===norm(name)&&String(r.type).toUpperCase()==='CNAME'&&norm(r.cname)===norm(target)):all.some(r=>norm(r.name)===norm(name)&&String(r.type).toUpperCase()==='A'&&norm(r.address)===norm(oldIp));
          if(!ok) throw new Error('verify_failed'); console.log(`P09_DNS_${mode.toUpperCase()}_OK=yes`);
          NODE
          cat >/tmp/p09-restore-cname.sh <<'SH'
          #!/bin/bash
          set -e
          cd "$GITHUB_WORKSPACE"
          if [ ! -f CNAME ]; then
            printf '%s\n' "$HOST" > CNAME
            git add CNAME
            git config user.name 'sitehub-bot'; git config user.email '53187583+programmer119@users.noreply.github.com'
            git commit -m 'Restore cruise custom domain after SiteHub certificate reset' || true
            git push origin HEAD:main || true
          fi
          SH
          chmod +x /tmp/p09-restore-cname.sh

      - name: Fully clear legacy Pages custom domain
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'sitehub-bot'; git config user.email '53187583+programmer119@users.noreply.github.com'
          rm CNAME; git add CNAME; git commit -m 'Temporarily clear cruise custom domain for certificate reset'; git push origin HEAD:main
          echo 'P09_CNAME_REMOVED=yes' >> "$GITHUB_ENV"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer $GH_DEPLOY_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS -X PUT "${auth[@]}" "$api" -d '{"cname":null}' >/tmp/p09-clear.json || true
          cleared=0
          for i in $(seq 1 90); do
            curl -fsS "${auth[@]}" "$api" >/tmp/p09-pages.json
            cname=$(node -e "const p=require('/tmp/p09-pages.json');process.stdout.write(String(p.cname||''))")
            state=$(node -e "const p=require('/tmp/p09-pages.json');process.stdout.write(String(p.https_certificate?.state||''))")
            echo "P09_CLEAR_STATE cname=$cname cert=$state attempt=$i"
            if [ -z "$cname" ]; then cleared=1; break; fi
            sleep 4
          done
          [ "$cleared" = 1 ]
          echo 'P09_PAGES_CUSTOM_DOMAIN_CLEARED=PASS'

      - name: Cut DNS only after Pages reset and wait for public resolvers
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'node /tmp/p09-dns.mjs rollback || true; /tmp/p09-restore-cname.sh || true' ERR
          node /tmp/p09-dns.mjs cutover
          echo 'P09_DNS_CHANGED=yes' >> "$GITHUB_ENV"
          ready=0
          for i in $(seq 1 100); do
            one=$(dig @1.1.1.1 +short CNAME "$HOST" | sed 's/\.$//' | head -n1)
            eight=$(dig @8.8.8.8 +short CNAME "$HOST" | sed 's/\.$//' | head -n1)
            echo "P09_DNS_PROPAGATION one=$one eight=$eight attempt=$i"
            if [ "$one" = "$PAGES_TARGET" ] && [ "$eight" = "$PAGES_TARGET" ]; then ready=1; break; fi
            sleep 4
          done
          [ "$ready" = 1 ]
          trap - ERR
          echo 'P09_DNS_PROPAGATION=PASS'

      - name: Restore CNAME and obtain a fresh Pages certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          rollback(){ echo 'P09_RESET_ROLLBACK_BEGIN=yes'; node /tmp/p09-dns.mjs rollback || true; /tmp/p09-restore-cname.sh || true; echo 'P09_RESET_ROLLBACK_END=yes'; }
          trap 'rollback' ERR
          printf '%s\n' "$HOST" > CNAME
          git add CNAME; git commit -m 'Restore cruise custom domain after full Pages reset'; git pull --rebase origin main; git push origin HEAD:main
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer $GH_DEPLOY_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS -X PUT "${auth[@]}" "$api" -d '{"cname":"cruise.suaveforge.com"}' >/tmp/p09-set.json || true
          approved=0
          for i in $(seq 1 180); do
            curl -fsS "${auth[@]}" "$api" >/tmp/p09-pages.json
            cname=$(node -e "const p=require('/tmp/p09-pages.json');process.stdout.write(String(p.cname||''))")
            state=$(node -e "const p=require('/tmp/p09-pages.json');process.stdout.write(String(p.https_certificate?.state||''))")
            desc=$(node -e "const p=require('/tmp/p09-pages.json');process.stdout.write(String(p.https_certificate?.description||''))")
            echo "P09_CERT_FRESH cname=$cname state=$state desc=$desc attempt=$i"
            [ "$state" = bad_authz ] && { echo 'fresh certificate fell into bad_authz'; exit 1; }
            if [ "$cname" = "$HOST" ] && [ "$state" = approved ]; then approved=1; break; fi
            sleep 4
          done
          [ "$approved" = 1 ]
          curl -fsS -X PUT "${auth[@]}" "$api" -d '{"https_enforced":true}' >/tmp/p09-https.json
          ok=0
          for i in $(seq 1 40); do
            code=$(curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/p09-live.html -w '%{http_code}' "https://$HOST/" || true)
            if [ "$code" = 200 ] && grep -q 'data-sitehub-project="p09"' /tmp/p09-live.html && grep -q 'CruisePickers' /tmp/p09-live.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ]
          trap - ERR
          echo 'P09_FULL_RESET_CUTOVER=PASS'
